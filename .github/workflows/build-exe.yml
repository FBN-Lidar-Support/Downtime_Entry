name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "INZ_Downtime_Entry" `
            --add-data "UI;UI" `
            main.py
      - name: Create Package
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item dist/INZ_Downtime_Entry.exe package/INZ_Downtime_Entry.exe
          Copy-Item config.ini package/config.ini
          Compress-Archive `
            -Path package/* `
            -DestinationPath INZ_Downtime_Entry.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: INZ-Downtime-Entry
          path: INZ_Downtime_Entry.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: INZ_Downtime_Entry.zip